<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>404 - Page Not Found</title>
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@400;700&display=swap">
	<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header>
	<div class="header-inner">
	<nav>
		<img src="favicon.svg" alt="Sticky Note">
		<a href="/">Home</a>
		<a href="/notes">Notes</a>
		<a href="/about">About</a>
	</nav>
	</div>
</header>
<main>
	<section class="error-page">
		<h1>404 | Page Not Found</h1>
		<p>The page you're looking for doesn't exist or has been moved.</p>
		<button type="button" id="add-btn" onclick="history.back()">Back</button>
		<button type="button" onclick="window.location.href = '/'">Home</button>
	</section>
</main>
</body>
</html>
