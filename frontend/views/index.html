<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Home - CPS630 Blog</title>
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@400;700&display=swap">
	<link rel="stylesheet" href="/css/style.css">
</head>
<body>
	<header>
		<div class="header-inner">
			<nav>
				<img src="favicon.svg" alt="Sticky Note">
				<a href="/">Home</a>
				<a href="/notes">Notes</a>
				<a href="/about">About</a>
			</nav>
		</div>
	</header>
	<main>
		<section class="hero">
			<h1>Welcome to CPS630 Blog</h1>
			<p>A place to write, share, and manage your notes.</p>
			<button type="button" id="add-btn" onclick="window.location.href = '/notes'">Browse Notes</button>
		</section>
		<br>
		<section class="features">
			<div class="feature-card">
				<h2>Write</h2>
				<p>Add a new note from the Notes page. Your entry is saved on the server.</p>
			</div>
			<div class="feature-card">
				<h2>Browse</h2>
				<p>View all notes in one place.</p>
			</div>
			<div class="feature-card">
				<h2>Delete</h2>
				<p>Remove a note you no longer need. Changes are reflected immediately.</p>
			</div>
		</section>
		<img src="notes_and_coffee.jpg" alt="Notes" style="max-width: 100%;">
	</main>
</body>
</html>
