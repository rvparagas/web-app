<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes - CPS630 Blog</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@400;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <nav>
        <img src="favicon.svg" alt="Sticky Note">
        <a href="/">Home</a>
        <a href="/notes">Notes</a>
        <a href="/about">About</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-header">
      <h1>Notes</h1>
    </section>

    <section class="notes-section">
      <div class="add-row">
        <input type="text" id="new-note" placeholder="Write a new note...">
        <button id="add-btn" class="btn">Add Post</button>
      </div>
      <div class="search-row">
        <input type="text" id="search-note" placeholder="Search posts...">
      </div>
      <div id="view-area" class="view-single"></div>
      <ul id="notes-list"></ul>
    </section>
  </main>

<script src="/js/notes.js"></script>
</body>
</html>
