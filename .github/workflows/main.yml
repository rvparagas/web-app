name: Node CI

on:
  push:
  pull_request:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Debug paths
        run: |
          pwd
          ls -la
          ls -la ./back-end

      - name: Install backend deps
        run: npm install
        working-directory: ./back-end

      - name: Start server
        run: |
          PORT=8080 npm start &
          sleep 5
          curl -f http://localhost:8080
        working-directory: ./back-end
