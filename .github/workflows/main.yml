name: Node CI

on:
  push:
  pull_request:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install

      - name: Start server
        run: |
          PORT=8080 node server.js &
          sleep 5
          curl -f http://localhost:8080
